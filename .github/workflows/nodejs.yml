name: CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24]

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm run coverage

            - name: Build
              run: npm run build

            - name: Size
              run: npm run size

            - name: Documentation
              if: matrix.node-version == 22
              run: npm run docs:build

            - uses: actions/upload-artifact@v5
              if: failure()
              with:
                  name: visual-output-${{ matrix.node-version }}
                  path: test/visual/__output__
