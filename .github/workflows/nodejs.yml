name: CI

on:
    push:
        branches:
            - master
            - v4
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20, 22, 24]

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm run coverage

            - name: Build
              run: npm run build

            - name: Size
              run: npm run size

            - name: Documentation
              if: matrix.node-version == 22
              run: npm run docs:build

            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: visual-output-${{ matrix.node-version }}
                  path: test/visual/__output__
